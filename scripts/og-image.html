.pills{display:flex;gap:12px;flex-wrap:wrap}

.pill i{width:10px;height:10px;border-radius:50%}
.g{background:#CFE8DC}.g i{background:#0E6B4F}.p{background:#FFD3E8}.p i{background:#B3175F}

.pink{position:absolute;right:0;bottom:0;width:290px;height:290px;border-radius:50%;background:#FF4FA3;mix-blend-mode:multiply}
.logo{position:absolute;left:60px;top:80px}
.bar{position:absolute;left:0;right:0;bottom:0;height:18px;background-color:#1D9E75;background-image:radial-gradient(circle,#0E6B4F 1.4px,transparent 1.9px);background-size:7px 7px}
